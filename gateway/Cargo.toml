[package]
name = "agentpay-gateway"
version = "0.1.0"
edition = "2021"
description = "AgentPay enforcement gateway: claim verification, policy, evidence"

# Deliberately its own workspace root. The Anchor program pins solana-program 3.x
# through anchor-lang, while the gateway needs the 4.x split crates that
# solana-client depends on. Sharing a workspace would force cargo to unify those
# trees and fail. The root Cargo.toml excludes this directory.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7", features = ["trace", "timeout"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ed25519-dalek = "3.0"
bs58 = "0.5"
sha2 = "0.10"

# Version bounds are dictated by solana-client 4.2, which depends on the
# granular split crates rather than solana-sdk. Adding solana-sdk alongside
# would build a second, conflicting tree.
solana-client = "4.2"
solana-pubkey = "4.2"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3"
solana-message = "4.2"
solana-transaction = "4.1"
solana-commitment-config = "3.1"
solana-sdk-ids = "3.1"

# Already in the tree via solana-client; declared directly for /v1/buy forwarding.
reqwest = { version = "0.12", features = ["json"] }

thiserror = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Pinned to 0.8 as specified. 0.9.0 is current; upgrading is a separate change.
# `migrate` is required for the embedded migrations run at startup.
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-native-tls",
    "chrono",
    "migrate",
    "macros",
] }

[profile.release]
overflow-checks = true
