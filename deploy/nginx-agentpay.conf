# nginx site for the AgentPay console.
#
# Terminates TLS and proxies to the `web` container on 127.0.0.1:3100. The
# gateway, Postgres and provider are never exposed — they bind loopback inside
# the compose network and no server block reaches them.
#
# # Why TLS is not optional here
#
# The verifier recomputes the evidence root in the browser with WebCrypto, and
# browsers expose `crypto.subtle` only in a SECURE CONTEXT. Served over plain
# HTTP on an IP address it is `undefined`, the recomputation throws, and the
# page reports "DOES NOT VERIFY" — a failure that is not one. That is why port
# 3100 is closed at the firewall and everything goes through here.
#
# Certificate lines are managed by certbot and appended on issuance.

server {
    listen 80;
    listen [::]:80;
    server_name 13-200-171-103.sslip.io;

    # Certbot writes its HTTP-01 challenge here; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 13-200-171-103.sslip.io;

    # ---- Security headers --------------------------------------------------
    #
    # Deliberately conservative. Each one was verified not to break the browser
    # verifier, which needs WebCrypto and Next.js's inline bootstrap.
    #
    # There is NO Content-Security-Policy, and that is a decision rather than an
    # omission. Next.js emits inline scripts and styles, so a strict CSP needs
    # per-response nonces wired through the application; a loose one carrying
    # `unsafe-inline` would be decoration. An unverified CSP that breaks the
    # verifier is worse than no CSP, because the verifier is the entire point of
    # this deployment.
    #
    # HSTS is one day, not the usual year. The certificate auto-renews and the
    # redirect works, but a short max-age keeps the decision reversible: a
    # year-long pin on a demo host is painful to undo if the address moves.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Do not advertise the stack. `server_tokens off` in nginx.conf hides the
    # nginx version; this hides Next.js's own banner.
    proxy_hide_header X-Powered-By;

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
